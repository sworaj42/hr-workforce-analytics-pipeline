# Settings shared by every Airflow container (merged in with <<: *airflow-common)
x-airflow-common: &airflow-common
  # Stock Airflow image + our pinned requirements (see Dockerfile)
  build: .
  # One tag shared by all Airflow services, so the image is built once
  image: hr-airflow:3.3.0
  environment: &airflow-common-env
    # Runs tasks as processes on this machine; no Redis/worker containers needed
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # FAB gives a normal username/password login created by airflow-init
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    # Encrypts connection passwords stored in the metadata DB
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    # All components must share one secret or task runs fail to authenticate
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Where running tasks report their state back to (Airflow 3 task API)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Lets DAGs import our code as the `pipeline` package
    PYTHONPATH: /opt/airflow
    # Settings read by pipeline/, using service names on the Docker network
    # instead of the localhost ports used from the host machine
    POSTGRES_HOST: warehouse-db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    # Shared so the UI can show logs written by tasks in the scheduler container
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

services:
  warehouse-db:
    image: postgres:16
    container_name: hr_warehouse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port is configurable: 5432 is often taken by a local Postgres install
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Landing zone: raw source files are dropped here before loading into bronze.
  # Official minio/minio images are no longer published; pgsty/minio is a
  # maintained build of the same open-source server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: hr_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API (used by code)
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-off job that plays the source system: creates the landing bucket and
  # drops the raw extracts into it, then exits. Safe to rerun.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: hr_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./data:/source:ro
    # $$ so the container's shell expands the variables, not docker compose
    entrypoint: >
      sh -c "
      set -e;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc cp /source/*.csv local/$$MINIO_BUCKET/;
      mc ls local/$$MINIO_BUCKET
      "
    restart: "no"

  # Airflow's own bookkeeping (runs, task states, users), kept apart from the
  # warehouse so rebuilding one never touches the other. Not exposed to the host.
  airflow-db:
    image: postgres:16
    container_name: hr_airflow_db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-off job: the image entrypoint migrates the metadata DB and creates the
  # admin user when these flags are set, then runs `airflow version` and exits.
  airflow-init:
    <<: *airflow-common
    container_name: hr_airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    restart: "no"

  # Web UI + REST API (http://localhost:8080)
  airflow-apiserver:
    <<: *airflow-common
    container_name: hr_airflow_apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Decides what is due and runs the tasks (LocalExecutor)
  airflow-scheduler:
    <<: *airflow-common
    container_name: hr_airflow_scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Parses the files in dags/ (separate from the scheduler since Airflow 3)
  airflow-dag-processor:
    <<: *airflow-common
    container_name: hr_airflow_dag_processor
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  warehouse_data:
  minio_data:
  airflow_db_data:
  airflow_logs:
