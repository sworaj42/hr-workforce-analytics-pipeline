<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" width="1160" height="440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1160" height="440" rx="14" fill="#0b0f17"/>

  <!-- Airflow orchestrates every step from bronze to the report -->
  <rect x="270" y="24" width="860" height="52" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.4"/>
  <text x="700" y="47" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="600">Airflow · hr_pipeline DAG</text>
  <text x="700" y="65" text-anchor="middle" fill="#7c8799" font-size="10">orchestration</text>
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="3 5" opacity=".5">
    <path d="M340,76 V150"/>
    <path d="M580,76 V150"/>
    <path d="M820,76 V150"/>
    <path d="M1060,76 V150"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Bronze, silver and gold are schemas in one Postgres database -->
  <rect x="252" y="128" width="656" height="140" rx="14" fill="#eab308" fill-opacity=".03" stroke="#8a6d1f" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="264" y="261" fill="#a68a3a" font-size="9">Postgres, medallion architecture</text>

  <!-- Wires between the main steps -->
  <g stroke="#3a4456" stroke-width="1.5" fill="none">
    <path id="w1" d="M170,198 H270"/>
    <path id="w2" d="M410,198 H510"/>
    <path id="w3" d="M650,198 H750"/>
    <path id="w4" d="M890,198 H990"/>
  </g>

  <!-- How each hop runs (above the wire) -->
  <g fill="#d1d5db" font-size="10" font-weight="600" text-anchor="middle">
    <text x="220" y="190">COPY</text>
    <text x="460" y="190">SQL</text>
    <text x="700" y="190">SQL</text>
    <text x="940" y="190">Python</text>
  </g>

  <!-- What each hop does to the data (below the wire) -->
  <g fill="#7c8799" font-size="9" text-anchor="middle">
    <text x="460" y="214">clean · typecast</text>
    <text x="460" y="227">dedup · derive</text>

    <text x="700" y="214">upsert dims</text>
    <text x="700" y="227">load fact</text>

    <text x="940" y="214">dq checks</text>
    <text x="940" y="227">gen report</text>
  </g>

  <!-- Main steps: name + what the data looks like there -->
  <g text-anchor="middle">
    <rect x="30" y="150" width="140" height="96" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
    <text x="100" y="174" fill="#9ca3af" font-size="13" font-weight="600">MinIO</text>
    <g fill="#7c8799" font-size="10">
      <text x="100" y="196">employee file</text>
      <text x="100" y="211">timesheet files</text>
      <text x="100" y="226">pipe-delimited CSV</text>
    </g>

    <rect x="270" y="150" width="140" height="96" rx="10" fill="#111827" stroke="#cd7f32" stroke-width="1.2"/>
    <text x="340" y="174" fill="#cd7f32" font-size="13" font-weight="600">Bronze</text>
    <g fill="#7c8799" font-size="10">
      <text x="340" y="196">employee +</text>
      <text x="340" y="211">timesheet tables</text>
      <text x="340" y="226">all TEXT</text>
    </g>

    <rect x="510" y="150" width="140" height="96" rx="10" fill="#111827" stroke="#c0c7d1" stroke-width="1.2"/>
    <text x="580" y="174" fill="#c0c7d1" font-size="13" font-weight="600">Silver</text>
    <g fill="#7c8799" font-size="10">
      <text x="580" y="196">employee +</text>
      <text x="580" y="211">timesheet tables</text>
      <text x="580" y="226">rejects + log</text>
    </g>

    <rect x="750" y="150" width="140" height="96" rx="10" fill="#111827" stroke="#eab308" stroke-width="1.2"/>
    <text x="820" y="174" fill="#eab308" font-size="13" font-weight="600">Gold</text>
    <g fill="#7c8799" font-size="10">
      <text x="820" y="196">3 dims</text>
      <text x="820" y="211">fact_timesheet</text>
      <text x="820" y="226">12 kpi_* views</text>
    </g>

    <rect x="990" y="150" width="140" height="96" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
    <text x="1060" y="174" fill="#9ca3af" font-size="13" font-weight="600">Quality</text>
    <g fill="#7c8799" font-size="10">
      <text x="1060" y="196">gold.dq_results</text>
      <text x="1060" y="211">markdown report</text>
    </g>
  </g>

  <!-- API reads and writes silver -->
  <path d="M580,246 V300" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5" opacity=".6" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <rect x="510" y="300" width="140" height="96" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
  <text x="580" y="324" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="600">FastAPI</text>
  <g text-anchor="middle" fill="#7c8799" font-size="10">
    <text x="580" y="346">CRUD employees</text>
    <text x="580" y="361">read timesheets</text>
    <text x="580" y="376">JWT authentication</text>
  </g>

  <!-- Which way data goes on the consumer lines -->
  <g fill="#7c8799" font-size="9">
    <text x="588" y="289">reads / writes</text>
    <text x="828" y="289">reads</text>
  </g>

  <!-- Dashboard reads the gold KPI views -->
  <path d="M820,246 V300" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5" opacity=".6" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <rect x="750" y="300" width="140" height="96" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
  <text x="820" y="324" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="600">Dashboard</text>
  <g text-anchor="middle" fill="#7c8799" font-size="10">
    <text x="820" y="346">Streamlit</text>
    <text x="820" y="361">reads gold KPI views</text>
  </g>

  <!-- One packet per wire, each moving in its own slot of a 6s loop -->
  <g filter="url(#glow)">
    <circle r="4" fill="#9ca3af" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.03;.18;1"><mpath href="#w1"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.03;.04;.17;.18;1"/>
    </circle>
    <circle r="4" fill="#cd7f32" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.23;.38;1"><mpath href="#w2"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.23;.24;.37;.38;1"/>
    </circle>
    <circle r="4" fill="#c0c7d1" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.43;.58;1"><mpath href="#w3"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.43;.44;.57;.58;1"/>
    </circle>
    <circle r="4" fill="#eab308" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.63;.78;1"><mpath href="#w4"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.63;.64;.77;.78;1"/>
    </circle>
  </g>

  <!-- Each step lights up briefly when its packet arrives -->
  <g fill="none" stroke-width="2.5" filter="url(#glow)">
    <rect x="270" y="150" width="140" height="96" rx="10" stroke="#cd7f32" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.18;.20;.28;1"/>
    </rect>
    <rect x="510" y="150" width="140" height="96" rx="10" stroke="#c0c7d1" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.38;.40;.48;1"/>
    </rect>
    <rect x="750" y="150" width="140" height="96" rx="10" stroke="#eab308" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.58;.60;.68;1"/>
    </rect>
    <rect x="990" y="150" width="140" height="96" rx="10" stroke="#6b7280" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.78;.80;.88;1"/>
    </rect>
  </g>

  <!-- Footer -->
  <text x="30" y="424" fill="#4b5563" font-size="10">Docker Compose · minio-init seeds the bucket from data/ · 30-day incremental window or full reload</text>
</svg>
