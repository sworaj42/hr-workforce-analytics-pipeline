<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="800" height="950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="950" rx="14" fill="#0b0f17"/>

  <!-- Bronze, silver and gold are schemas in one Postgres database -->
  <rect x="100" y="166" width="350" height="540" rx="14" fill="#eab308" fill-opacity=".03" stroke="#8a6d1f" stroke-width="1" stroke-dasharray="8 5"/>
  <g fill="#a68a3a" font-size="12">
    <text x="112" y="188">Postgres,</text>
    <text x="112" y="202">medallion</text>
    <text x="112" y="216">architecture</text>
  </g>

  <!-- Airflow orchestrates every step from bronze to the report -->
  <rect x="20" y="224" width="56" height="652" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.4"/>
  <text x="44" y="550" transform="rotate(-90 44 550)" text-anchor="middle" fill="#9ca3af" font-size="16" font-weight="600">Airflow · hr_pipeline DAG</text>
  <text x="64" y="550" transform="rotate(-90 64 550)" text-anchor="middle" fill="#7c8799" font-size="12">orchestration</text>
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="3 5" opacity=".5">
    <path d="M76,274 H160"/>
    <path d="M76,450 H160"/>
    <path d="M76,626 H160"/>
    <path d="M76,826 H160"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Wires between the main steps -->
  <g stroke="#3a4456" stroke-width="1.5" fill="none">
    <path id="w1" d="M280,124 V224"/>
    <path id="w2" d="M280,324 V400"/>
    <path id="w3" d="M280,500 V576"/>
    <path id="w4" d="M280,676 V776"/>
  </g>

  <!-- How each hop runs (left of the wire) -->
  <g fill="#d1d5db" font-size="13" font-weight="600" text-anchor="end">
    <text x="268" y="150">COPY</text>
    <text x="268" y="366">SQL</text>
    <text x="268" y="542">SQL</text>
    <text x="268" y="746">Python</text>
  </g>

  <!-- What each hop does to the data (right of the wire) -->
  <g fill="#7c8799" font-size="13">
    <text x="292" y="358">clean · typecast</text>
    <text x="292" y="376">dedup · derive</text>

    <text x="292" y="534">upsert dims</text>
    <text x="292" y="552">load fact</text>

    <text x="292" y="738">dq checks</text>
    <text x="292" y="756">gen report</text>
  </g>

  <!-- Main steps: name + what the data looks like there -->
  <g text-anchor="middle">
    <rect x="160" y="24" width="240" height="100" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
    <text x="280" y="52" fill="#9ca3af" font-size="18" font-weight="600">MinIO</text>
    <g fill="#7c8799" font-size="14">
      <text x="280" y="76">employee file</text>
      <text x="280" y="94">timesheet files</text>
      <text x="280" y="112">pipe-delimited CSV</text>
    </g>

    <rect x="160" y="224" width="240" height="100" rx="10" fill="#111827" stroke="#cd7f32" stroke-width="1.2"/>
    <text x="280" y="252" fill="#cd7f32" font-size="18" font-weight="600">Bronze</text>
    <g fill="#7c8799" font-size="14">
      <text x="280" y="276">employee +</text>
      <text x="280" y="294">timesheet tables</text>
      <text x="280" y="312">all TEXT</text>
    </g>

    <rect x="160" y="400" width="240" height="100" rx="10" fill="#111827" stroke="#c0c7d1" stroke-width="1.2"/>
    <text x="280" y="428" fill="#c0c7d1" font-size="18" font-weight="600">Silver</text>
    <g fill="#7c8799" font-size="14">
      <text x="280" y="452">employee +</text>
      <text x="280" y="470">timesheet tables</text>
      <text x="280" y="488">rejects + log</text>
    </g>

    <rect x="160" y="576" width="240" height="100" rx="10" fill="#111827" stroke="#eab308" stroke-width="1.2"/>
    <text x="280" y="604" fill="#eab308" font-size="18" font-weight="600">Gold</text>
    <g fill="#7c8799" font-size="14">
      <text x="280" y="628">3 dims</text>
      <text x="280" y="646">fact_timesheet</text>
      <text x="280" y="664">12 kpi_* views</text>
    </g>

    <rect x="160" y="776" width="240" height="100" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
    <text x="280" y="804" fill="#9ca3af" font-size="18" font-weight="600">Quality</text>
    <g fill="#7c8799" font-size="14">
      <text x="280" y="828">gold.dq_results</text>
      <text x="280" y="846">markdown report</text>
    </g>
  </g>

  <!-- API reads and writes silver; dashboard reads gold -->
  <g stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5" opacity=".6" fill="none">
    <path d="M400,450 H570"/>
    <path d="M400,626 H570"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <g fill="#7c8799" font-size="12" text-anchor="middle">
    <text x="510" y="442">reads / writes</text>
    <text x="510" y="618">reads</text>
  </g>

  <g text-anchor="middle">
    <rect x="570" y="400" width="210" height="100" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
    <text x="675" y="428" fill="#9ca3af" font-size="18" font-weight="600">FastAPI</text>
    <g fill="#7c8799" font-size="14">
      <text x="675" y="452">CRUD employees</text>
      <text x="675" y="470">read timesheets</text>
      <text x="675" y="488">JWT authentication</text>
    </g>

    <rect x="570" y="576" width="210" height="100" rx="10" fill="#111827" stroke="#6b7280" stroke-width="1.2"/>
    <text x="675" y="604" fill="#9ca3af" font-size="18" font-weight="600">Dashboard</text>
    <g fill="#7c8799" font-size="14">
      <text x="675" y="628">Streamlit</text>
      <text x="675" y="646">reads gold KPI views</text>
    </g>
  </g>

  <!-- One packet per wire, each moving in its own slot of a 6s loop.
       Its colour is the layer it just left. -->
  <g filter="url(#glow)">
    <circle r="5" fill="#9ca3af" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.03;.18;1"><mpath href="#w1"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.03;.04;.17;.18;1"/>
    </circle>
    <circle r="5" fill="#cd7f32" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.23;.38;1"><mpath href="#w2"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.23;.24;.37;.38;1"/>
    </circle>
    <circle r="5" fill="#c0c7d1" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.43;.58;1"><mpath href="#w3"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.43;.44;.57;.58;1"/>
    </circle>
    <circle r="5" fill="#eab308" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.63;.78;1"><mpath href="#w4"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.63;.64;.77;.78;1"/>
    </circle>
  </g>

  <!-- Each step lights up briefly when its packet arrives -->
  <g fill="none" stroke-width="2.5" filter="url(#glow)">
    <rect x="160" y="224" width="240" height="100" rx="10" stroke="#cd7f32" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.18;.20;.28;1"/>
    </rect>
    <rect x="160" y="400" width="240" height="100" rx="10" stroke="#c0c7d1" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.38;.40;.48;1"/>
    </rect>
    <rect x="160" y="576" width="240" height="100" rx="10" stroke="#eab308" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.58;.60;.68;1"/>
    </rect>
    <rect x="160" y="776" width="240" height="100" rx="10" stroke="#6b7280" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.78;.80;.88;1"/>
    </rect>
  </g>

  <!-- Footer -->
  <g fill="#4b5563" font-size="12">
    <text x="20" y="912">Docker Compose · minio-init seeds the bucket from data/</text>
    <text x="20" y="930">30-day incremental window or full reload</text>
  </g>
</svg>
